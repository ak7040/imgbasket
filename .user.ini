; Raise PHP's limits for big uploads and long downloads. Hostinger may cap these; if uploads
; still fail, raise them in hPanel > Advanced > PHP Configuration.
upload_max_filesize = 2048M
post_max_size = 2100M
max_execution_time = 600
max_input_time = 600
memory_limit = 512M
; Never show PHP errors (they include server paths) to visitors; they still go to the error log
display_errors = Off
log_errors = On
